# Builds HtmlScreensaver-Setup.exe on every push to main and publishes it as a GitHub release.
# One release per version: the tag is v<Version> from src/screensaver/HtmlScreensaver.csproj.
# Bump <Version> there to get a new release; pushes without a bump replace the current release's exe
# (and move its tag to the new commit, so the release always matches the source it was built from).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-Xml -Path src/screensaver/HtmlScreensaver.csproj -XPath '//Version').Node.InnerText.Trim()
          if (-not $version) { throw "No <Version> found in HtmlScreensaver.csproj" }
          $tag = "v$version"
          $exe = 'dist/HtmlScreensaver-Setup.exe'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating release $tag"
            git tag -f $tag $env:GITHUB_SHA
            git push -f origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Couldn't move tag $tag" }
            gh release upload $tag $exe --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag $exe --target $env:GITHUB_SHA --title "HTML Screensaver $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
